items:
  - text: Harrington & Kauffman reinvent, or just blow up, whatever category they're meant to occupy.
    critic: Liz Nicholls
    publication: Edmonton Journal
    year: 2009
    production: Cabaret Terrarium
  - text: The show is at once absurd and sweet, smart and silly.
    critic: Jessica Potter
    publication: See Magazine
    year: 2009
    production: Cabaret Terrarium
  - text: They raise the level of comedy to a high art.
    critic: Robert Enright
    publication: The Globe and Mail
    year: 2002
    production: Nharcolepsy
  - text: The two are masters of deadpan humor, intertwining a font of Belgian grandmother jokes with a surprising amount of emotionality.
    critic: Leah B. Green
    publication: The Seattle Times
    year: 2003
    production: Nharcolepsy
  - text: The actors have created two totally inexplicable characters who could probably stand on stage brushing their hair for 20 minutes and make you laugh.
    critic: Anna Ditkoff
    publication: Baltimore CityPaper
    year: 2001
    production: Motel California
  - text: I am excited and a little afraid to see what these two will do next.
    critic: Andy Buck
    publication: Back Stage
    year: 2000
    production: Motel California
