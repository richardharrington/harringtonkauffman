bios:
  - name: Richard Harrington
    role: Gustave; writer and performer
    text: >-
      Richard Harrington, when not working on Harrington & Kauffman shows with
      Chris, has written and performed in plays in San Francisco and New York.
      He toured his one-person show, Saving the Desert Tortoise, to fringe
      festivals in Canada and performed it in New York at HERE Arts Center. He
      studied acting at the École Philippe Gaulier in London and Paris, with the
      San Francisco Mime Troupe, with the Saratoga International Theater
      Institute, and at Williams College.
    relatedUrl: /harrington/
    relatedLabel: Saving the Desert Tortoise (related solo work)
  - name: Chris Kauffman
    role: Nhar; writer and performer
    text: >-
      Chris Kauffman has performed and directed theater in New York, toured
      Brazil and Canada with contemporary dance company Dona Orpheline, and was
      co-director of The Greylock Theatre Project with Emily Windover for six
      seasons at the Williamstown Theatre Festival. The previous company
      biography identifies him as a member of the Theatre faculty at Gettysburg
      College and notes his film appearance in 1000-1: The Cory Weissman Story.
  - name: Patricia Buckley
    role: Director and principal company collaborator
    text: >-
      Patricia Buckley directed Motel California and Nharcolepsy. Her previous
      company biography records directing work for Actors Shakespeare Company,
      Dixon Place, and the Franklin Stage Company, and projects touring the
      Canadian Fringe, Piccolo Spoleto, and Aspen Comedy Festivals. She is a
      founding member of the physical-comedy troupe Gams On The Lam and was a
      collaborating performer and writer with Théâtre de la Jeune Lune. Her
      performing work has included New York, regional theater, film, and
      television, and she wrote and performed the solo show Evolution.
