history: >-
  New York-based performers Richard Harrington and Chris Kauffman met in a
  clown workshop with David Shiner in 1997. They began crafting the blend of
  comedy, absurdity, tragedy, geography, and accordion music that became the
  two-person team of Belgian cabaret singer Gustave and his associate Nhar.
  Harrington & Kauffman debuted their first Gustave and Nhar show, Motel
  California, in 1999; Nharcolepsy followed in 2002 and Cabaret Terrarium in
  2009. Their work has toured in North America and internationally.
